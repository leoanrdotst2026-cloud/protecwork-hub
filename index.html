<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Protecwork Hub — Carregando…</title>
<style>
body{margin:0;background:#090D0B;color:#F5F7F6;font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:100vh}
.box{text-align:center}
.bar{width:220px;height:6px;background:rgba(255,255,255,.1);border-radius:6px;overflow:hidden;margin:16px auto}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#087A38,#39FF88);transition:width .3s}
</style>
</head>
<body>
<div class="box">
  <div style="font-size:22px;font-weight:700;margin-bottom:8px">Protecwork Hub</div>
  <div style="color:#9BA59F;font-size:14px">Carregando o sistema…</div>
  <div class="bar"><i id="p"></i></div>
</div>
<script>
(async () => {
  const n = 8;
  const parts = [];
  for (let i = 0; i < n; i++) {
    const r = await fetch('c' + i + '.txt');
    if (!r.ok) throw new Error('Falha ao carregar c' + i + '.txt (' + r.status + ')');
    parts.push(await r.text());
    document.getElementById('p').style.width = ((i+1)/n*100) + '%';
  }
  document.open();
  document.write(parts.join(''));
  document.close();
})().catch(e => {
  document.body.innerHTML = '<div class="box"><b>Erro ao carregar</b><p style="color:#9BA59F">' + e.message + '</p></div>';
  console.error(e);
});
</script>
</body>
</html>
