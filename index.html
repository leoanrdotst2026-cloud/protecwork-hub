<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Protecwork Hub</title>
<style>
body{margin:0;background:#090D0B;color:#F5F7F6;font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:100vh}
.box{text-align:center;padding:24px}
.bar{width:240px;height:6px;background:rgba(255,255,255,.1);border-radius:6px;overflow:hidden;margin:18px auto 0}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#087A38,#39FF88);transition:width .25s}
</style>
</head>
<body>
<div class="box">
  <div style="font-size:20px;font-weight:700;margin-bottom:8px">Protecwork Hub</div>
  <div style="color:#9BA59F;font-size:14px" id="st">Carregando o sistema…</div>
  <div class="bar"><i id="p"></i></div>
</div>
<script>
(async()=>{
  const n=10;
  for(let i=0;i<n;i++){
    await new Promise((res,rej)=>{
      const s=document.createElement('script');
      s.src='p'+i+'.js';
      s.onload=res; s.onerror=()=>rej(new Error('Falha ao carregar p'+i+'.js'));
      document.head.appendChild(s);
    });
    document.getElementById('p').style.width=((i+1)/n*100)+'%';
  }
  const html = (window.__PW||[]).map(b=>{
    const bin=atob(b);
    const bytes=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    return new TextDecoder('utf-8').decode(bytes);
  }).join('');
  document.open(); document.write(html); document.close();
})().catch(e=>{
  document.getElementById('st').innerHTML='<span style="color:#FF4D4F">Erro: '+e.message+'</span>';
});
</script>
</body>
</html>
