<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Protecwork Hub — Carregando…</title>
<style>
body{margin:0;background:#090D0B;color:#F5F7F6;font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:100vh}
.box{text-align:center;padding:24px}
.bar{width:240px;height:6px;background:rgba(255,255,255,.1);border-radius:6px;overflow:hidden;margin:18px auto 0}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#087A38,#39FF88);transition:width .25s}
.logo{width:48px;height:48px;border-radius:14px;margin:0 auto 14px;display:grid;place-items:center;background:linear-gradient(150deg,#39FF88,#087A38);box-shadow:0 8px 24px -8px #00C853}
</style>
</head>
<body>
<div class="box">
  <div class="logo"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#04150C" stroke-width="2.3"><path d="M12 2l8 3.5v6c0 5-3.4 9.3-8 10.5-4.6-1.2-8-5.5-8-10.5v-6z"/><path d="M9 12l2 2 4-4"/></svg></div>
  <div style="font-size:20px;font-weight:700">Protecwork Hub</div>
  <div style="color:#9BA59F;font-size:14px;margin-top:6px">Carregando o sistema…</div>
  <div class="bar"><i id="p"></i></div>
</div>
<script>
(async()=>{
  const n=10,parts=[];
  for(let i=0;i<n;i++){
    const r=await fetch('c'+i+'.txt');
    if(!r.ok) throw new Error('chunk c'+i+' HTTP '+r.status);
    parts.push(await r.text());
    document.getElementById('p').style.width=((i+1)/n*100)+'%';
  }
  document.open();document.write(parts.join(''));document.close();
})().catch(e=>{
  document.body.innerHTML='<div class="box"><b>Erro ao carregar</b><p style="color:#FF4D4F;font-size:14px">'+e.message+'</p></div>';
  console.error(e);
});
</script>
</body>
</html>
